{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style-login.css') }}">

<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Accedi</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="error-message" style="color: red; text-align: center; margin-bottom: 15px;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <form action="{{ url_for('login') }}" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Inserisci il tuo username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Inserisci la password" required>
                </div>
                
                <button type="submit" class="btn-accedi">Entra</button>
            </form>
        </div>
    </div>
</body>
{% endblock %}
